                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    role:
                      description: 'role is the grantee: a PostgreSQL role, or PUBLIC.'
                      type: string
                    schema:
                      description: schema is the extension's schema, for kind schema.
                      type: string
                  required:
                  - extension
                  - kind
                  - role
                  type: object
                maxItems: 1024
                type: array
                x-kubernetes-list-map-keys:
                - extension
                - role
                - kind
                x-kubernetes-list-type: map
              managedGrants:
                description: |-
                  managedGrants lists the database privileges pgop has granted. Only
                  these are revoked when they are removed from spec.grants.
                items:
                  description: ManagedDatabaseGrant records database privileges that
                    pgop granted to a role.
                  properties:
                    grantOptions:
                      description: |-
                        grantOptions are the privileges whose grant option pgop added (the
                        grantee could not grant them on before). Revoking them cascades to
                        what the grantee passed on.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    privileges:
                      description: |-
                        privileges are the privileges pgop added: those the grantee did not
