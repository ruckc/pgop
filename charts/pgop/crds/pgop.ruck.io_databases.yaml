                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    role:
                      description: role is the PostgreSQL role the privileges were
                        granted to.
                      type: string
                    withGrantOption:
                      description: |-
                        withGrantOption is deprecated and no longer written: pgop v0.15 recorded
