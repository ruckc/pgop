                  - publicSchemaCreate
                  type: string
                maxItems: 4
                type: array
                x-kubernetes-list-type: set
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Database named postgres, template0 or template1 must set spec.databaseName:
