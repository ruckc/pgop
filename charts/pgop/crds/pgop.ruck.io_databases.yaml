---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: databases.pgop.ruck.io
spec:
  group: pgop.ruck.io
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.databaseName
      name: PGName
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Database is the Schema for the databases API.
          It represents a PostgreSQL database managed by the operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Database
            properties:
              clusterRef:
                description: clusterRef references the PostgreSQL Cluster this database
                  belongs to
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              databaseName:
                description: |-
                  databaseName is the name of the database in PostgreSQL. It defaults to
                  metadata.name when unset, and lets the PostgreSQL name use characters
                  (such as underscores) that Kubernetes object names do not allow.
                  It must be a lowercase unquoted identifier, must not be a reserved
                  database name (postgres, template0, template1), and cannot be changed
                  after creation.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z_][a-z0-9_]*$
                type: string
                x-kubernetes-validations:
                - message: databaseName must not be a reserved database name (postgres,
                    template0, template1)
                  rule: '!(self in [''postgres'', ''template0'', ''template1''])'
              extensions:
                description: |-
                  extensions lists PostgreSQL extensions to install in this database.
                  The operator installs them as a superuser, so only extensions that the
                  server marks as trusted (pg_available_extension_versions.trusted) or
                  that the Cluster lists in spec.rolePolicy.allowedExtensions are
                  installed; others are reported with reason ExtensionNotAllowed.
                  Extensions are never dropped when removed from the list.
                items:
                  description: ExtensionSpec defines a PostgreSQL extension to install
                  properties:
                    name:
                      description: name is the name of the PostgreSQL extension
                      maxLength: 63
                      minLength: 1
                      pattern: ^[A-Za-z0-9_-]+$
                      type: string
                    schema:
                      description: |-
                        schema is the schema to install the extension into. If not specified,
                        the extension is installed into the schema named by its control file,
                        or else into public.
                      maxLength: 63
                      type: string
                    version:
                      description: |-
                        version is the version of the extension to install.
                        If not specified, the default version is installed.
                      maxLength: 64
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              grants:
                description: |-
                  grants lists database-level privileges (GRANT ... ON DATABASE) to grant
                  to PostgreSQL roles. Privileges that pgop granted (tracked in
                  status.managedGrants) are revoked once they are removed from the spec;
                  privileges granted outside pgop are never revoked.
                items:
                  description: DatabaseGrantSpec grants database-level privileges
                    to a PostgreSQL role.
                  properties:
                    privileges:
                      description: |-
                        privileges lists the database privileges to grant: CONNECT, CREATE,
                        TEMPORARY (or TEMP), or ALL (all three).
                      items:
                        enum:
                        - CONNECT
                        - CREATE
                        - TEMPORARY
                        - TEMP
                        - ALL
                        type: string
                      maxItems: 5
                      minItems: 1
                      type: array
                    role:
                      description: |-
                        role is the grantee: the PostgreSQL name of a role (a raw PostgreSQL
                        role name, not a Role resource name), or PUBLIC (upper case) for every
                        role. A role must be managed by a Role of the same Cluster (created or
                        adopted by it, recorded in its status) or be listed in the Cluster's
                        spec.rolePolicy.allowedExistingRoles; superusers, postgres, pgop_* and
                        predefined pg_* roles are never accepted (reason GranteeNotAllowed). The
                        role must exist; the grant is retried until it does.
                      maxLength: 63
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: write the PUBLIC pseudo-role in upper case
                        rule: self == 'PUBLIC' || self.lowerAscii() != 'public'
                      - message: role must not be postgres, none, a pgop_* role or
                          a predefined pg_* role
                        rule: self != 'postgres' && !self.startsWith('pgop_') && !self.startsWith('pg_')
                          && self.lowerAscii() != 'none'
                    withGrantOption:
                      description: |-
                        withGrantOption allows the grantee to grant the same privileges to
                        others. Turning it off for a grant pgop made revokes the grant option.
                      type: boolean
                  required:
                  - privileges
                  - role
                  type: object
                  x-kubernetes-validations:
                  - message: the grant option cannot be granted to PUBLIC
                    rule: self.role != 'PUBLIC' || !has(self.withGrantOption) || !self.withGrantOption
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - role
                x-kubernetes-list-type: map
              owner:
                description: |-
                  owner is the name of the Role resource (in the same namespace) that owns
                  this database. The database is owned by that Role's effective PostgreSQL
                  role name (its spec.roleName, or metadata.name when unset).
                  If not specified, the operator superuser will be the owner.
                type: string
              publicPrivileges:
                description: |-
                  publicPrivileges revokes the privileges PostgreSQL gives the PUBLIC
                  pseudo-role (every role) by default: CONNECT and TEMPORARY on the
                  database, and USAGE (and, before PostgreSQL 15, CREATE) on the schema
                  named public. A field set to false revokes that privilege from PUBLIC;
                  unset (or true) leaves PostgreSQL's default alone. pgop records what it
                  revoked in status.revokedPublicPrivileges and grants exactly that back
                  to PUBLIC once the field is unset or set to true again; a privilege
                  PUBLIC did not hold is not recorded and never granted. Revoking CONNECT
                  from PUBLIC locks out every role that has no CONNECT grant of its own
                  (the owner and superusers keep it): grant it in spec.grants.
                properties:
                  connect:
                    description: 'connect: false revokes CONNECT on the database from
                      PUBLIC.'
                    type: boolean
                  publicSchemaCreate:
                    description: |-
                      publicSchemaCreate: false revokes CREATE on the schema public from
                      PUBLIC (PostgreSQL 15 and later no longer grant it by default).
                    type: boolean
                  publicSchemaUsage:
                    description: |-
                      publicSchemaUsage: false revokes USAGE on the schema public from
                      PUBLIC.
                    type: boolean
                  temporary:
                    description: 'temporary: false revokes TEMPORARY on the database
                      from PUBLIC.'
                    type: boolean
                type: object
              schemas:
                description: schemas lists schemas to create in this database
                items:
                  description: SchemaSpec defines a schema to create in the database
                  properties:
                    grants:
                      description: |-
                        grants lists privileges to grant on this schema (GRANT ... ON
                        SCHEMA). Privileges that pgop granted (tracked in
                        status.managedSchemaGrants) are revoked once they are removed from the
                        spec, also when the whole schema entry is removed (the schema itself is
                        never dropped); privileges granted outside pgop are never revoked.
                      items:
                        description: GrantSpec defines privileges to grant to a role
                        properties:
                          privileges:
                            description: |-
                              privileges lists the schema privileges to grant: USAGE, CREATE or ALL
                              (also written ALL PRIVILEGES), in any letter case.
                            items:
                              maxLength: 32
                              pattern: ^(?i:usage|create|all|all privileges)$
                              type: string
                            maxItems: 8
                            minItems: 1
                            type: array
                          role:
                            description: |-
                              role is the grantee: the PostgreSQL name of a role (a raw PostgreSQL
                              role name, not a Role resource name), or PUBLIC (upper case) for every
                              role. A role must be managed by a Role of the same Cluster (created or
                              adopted by it, recorded in its status) or be listed in the Cluster's
                              spec.rolePolicy.allowedExistingRoles; superusers, postgres, pgop_* and
                              predefined pg_* roles are never accepted (reason GranteeNotAllowed). The
                              role must exist; the grant is retried until it does.
                            maxLength: 63
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: write the PUBLIC pseudo-role in upper case
                              rule: self == 'PUBLIC' || self.lowerAscii() != 'public'
                            - message: role must not be postgres, none, a pgop_* role
                                or a predefined pg_* role
                              rule: self != 'postgres' && !self.startsWith('pgop_')
                                && !self.startsWith('pg_') && self.lowerAscii() !=
                                'none'
                          withGrantOption:
                            description: |-
                              withGrantOption allows the grantee to grant the same privileges to
                              others. Turning it off for a grant pgop made revokes the grant option.
                            type: boolean
                        required:
                        - privileges
                        - role
                        type: object
                        x-kubernetes-validations:
                        - message: the grant option cannot be granted to PUBLIC
                          rule: self.role != 'PUBLIC' || !has(self.withGrantOption)
                            || !self.withGrantOption
                      maxItems: 16
                      type: array
                      x-kubernetes-list-map-keys:
                      - role
                      x-kubernetes-list-type: map
                    name:
                      description: |-
                        name is the name of the schema. System schemas (pg_catalog,
                        information_schema and other names starting with pg_) are not allowed:
                        owning or creating objects in them would affect every session in the
                        database, including the operator's superuser sessions.
                      maxLength: 63
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: schema name must not be a system schema (pg_* or
                          information_schema)
                        rule: '!self.startsWith(''pg_'') && self != ''information_schema'''
                    owner:
                      description: |-
                        owner is the role that owns this schema.
                        If not specified, the database owner will be the schema owner.
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              settings:
                additionalProperties:
                  type: string
                description: |-
                  settings are per-database defaults for configuration parameters
                  (ALTER DATABASE ... SET name TO value). They apply to new sessions.
                  Settings that pgop applied (tracked in status.managedSettings) are reset
                  (ALTER DATABASE ... RESET name) once they are removed from the spec.
                  Keys are parameter names (for example work_mem or myapp.tenant); values
                  are written as SQL string literals. For the list parameters search_path
                  and temp_tablespaces the value is a comma-separated list as in
                  postgresql.conf (the YAML string "$user", public with the double quotes
                  kept); an empty list is rejected.
                  Only parameters that any user may set (context "user" in pg_settings)
                  and custom parameters are accepted; superuser-only parameters and a
                  denylist of identity-switching, code-loading and safeguard-bypassing
                  parameters are refused (reason SettingNotAllowed), because pgop runs
                  ALTER DATABASE as a superuser.
                maxProperties: 256
                type: object
                x-kubernetes-validations:
                - message: 'settings keys must be parameter names: identifiers ([A-Za-z_][A-Za-z0-9_]*)
                    optionally separated by dots, at most 127 characters'
                  rule: self.all(k, size(k) <= 127 && k.matches('^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$'))
                - message: settings values must be at most 4096 characters
                  rule: self.all(k, size(self[k]) <= 4096)
                - message: settings must not include role, session_authorization,
                    *_preload_libraries, dynamic_library_path, jit_provider, session_replication_role,
                    lo_compat_privileges or pgaudit.*, set_user.*, anon.*, sepgsql.*
                    parameters
                  rule: '!self.exists(k, k.lowerAscii() in [''role'', ''session_authorization'',
                    ''session_preload_libraries'', ''local_preload_libraries'', ''shared_preload_libraries'',
                    ''dynamic_library_path'', ''jit_provider'', ''session_replication_role'',
                    ''lo_compat_privileges''] || k.lowerAscii().startsWith(''pgaudit.'')
                    || k.lowerAscii().startsWith(''set_user.'') || k.lowerAscii().startsWith(''anon.'')
                    || k.lowerAscii().startsWith(''sepgsql.''))'
            required:
            - clusterRef
            type: object
            x-kubernetes-validations:
            - message: grants must not grant PUBLIC a privilege that publicPrivileges
                revokes
              rule: '!has(self.publicPrivileges) || !has(self.grants) || !self.grants.exists(g,
                g.role == ''PUBLIC'' && ((has(self.publicPrivileges.connect) && !self.publicPrivileges.connect
                && g.privileges.exists(p, p in [''CONNECT'', ''ALL''])) || (has(self.publicPrivileges.temporary)
                && !self.publicPrivileges.temporary && g.privileges.exists(p, p in
                [''TEMPORARY'', ''TEMP'', ''ALL'']))))'
            - message: schemas[public].grants must not grant PUBLIC a privilege that
                publicPrivileges revokes
              rule: '!has(self.publicPrivileges) || !has(self.schemas) || !self.schemas.exists(s,
                s.name == ''public'' && has(s.grants) && s.grants.exists(g, g.role
                == ''PUBLIC'' && ((has(self.publicPrivileges.publicSchemaUsage) &&
                !self.publicPrivileges.publicSchemaUsage && g.privileges.exists(p,
                p.lowerAscii() in [''usage'', ''all'', ''all privileges''])) || (has(self.publicPrivileges.publicSchemaCreate)
                && !self.publicPrivileges.publicSchemaCreate && g.privileges.exists(p,
                p.lowerAscii() in [''create'', ''all'', ''all privileges''])))))'
            - message: clusterRef is immutable; create a new Database for another
                Cluster
              rule: self.clusterRef.name == oldSelf.clusterRef.name
            - message: databaseName is immutable
              rule: has(oldSelf.databaseName) == has(self.databaseName) && (!has(self.databaseName)
                || self.databaseName == oldSelf.databaseName)
          status:
            description: status defines the observed state of Database
            properties:
              clusterUID:
                description: |-
                  clusterUID is the UID of the Cluster on which databaseName was created
                  or adopted. pgop only treats databaseName as this Database's own when
                  it matches the UID of the Cluster the Database references.
                type: string
              conditions:
                description: conditions represent the current state of the Database
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createdSchemas:
                description: createdSchemas lists schemas that have been successfully
                  created
                items:
                  type: string
                type: array
              databaseName:
                description: databaseName is the effective PostgreSQL database name
                  that was reconciled.
                type: string
              installedExtensions:
                description: installedExtensions lists extensions that have been successfully
                  installed
                items:
                  type: string
                type: array
              managedGrants:
                description: |-
                  managedGrants lists the database privileges pgop has granted. Only
                  these are revoked when they are removed from spec.grants.
                items:
                  description: ManagedDatabaseGrant records database privileges that
                    pgop granted to a role.
                  properties:
                    privileges:
                      description: |-
                        privileges are the granted privileges, normalized (TEMP is recorded as
                        TEMPORARY and ALL as CONNECT, CREATE and TEMPORARY).
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    role:
                      description: role is the PostgreSQL role the privileges were
                        granted to.
                      type: string
                    withGrantOption:
                      description: |-
                        withGrantOption records whether pgop granted the privileges with the
                        grant option.
                      type: boolean
                  required:
                  - privileges
                  - role
                  type: object
                maxItems: 512
                type: array
                x-kubernetes-list-map-keys:
                - role
                x-kubernetes-list-type: map
              managedSchemaGrants:
                description: |-
                  managedSchemaGrants lists the schema privileges pgop has granted. Only
                  these are revoked when they are removed from spec.schemas[].grants.
                items:
                  description: ManagedSchemaGrant records schema privileges that pgop
                    granted to a role.
                  properties:
                    privileges:
                      description: |-
                        privileges are the granted privileges, normalized (ALL is recorded as
                        CREATE and USAGE).
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    role:
                      description: 'role is the grantee: a PostgreSQL role, or PUBLIC.'
                      type: string
                    schema:
                      description: schema is the schema the privileges are on.
                      type: string
                    withGrantOption:
                      description: |-
                        withGrantOption records whether pgop granted the privileges with the
                        grant option.
                      type: boolean
                  required:
                  - privileges
                  - role
                  - schema
                  type: object
                maxItems: 2048
                type: array
                x-kubernetes-list-map-keys:
                - schema
                - role
                x-kubernetes-list-type: map
              managedSettings:
                description: |-
                  managedSettings lists the parameter names pgop has set with ALTER
                  DATABASE ... SET (normalized to lowercase). Only these are reset when
                  they are removed from spec.settings.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              ready:
                description: ready indicates if the database has been created
                type: boolean
              revokedPublicPrivileges:
                description: |-
                  revokedPublicPrivileges lists the default PUBLIC privileges pgop has
                  revoked for spec.publicPrivileges. Only these are granted back to
                  PUBLIC when spec.publicPrivileges no longer revokes them.
                items:
                  description: |-
                    PublicPrivilege names a default PUBLIC privilege that
                    spec.publicPrivileges can revoke (the name of its field there).
                  enum:
                  - connect
                  - temporary
                  - publicSchemaUsage
                  - publicSchemaCreate
                  type: string
                maxItems: 4
                type: array
                x-kubernetes-list-type: set
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Database named postgres, template0 or template1 must set spec.databaseName:
            those PostgreSQL databases are reserved'
          rule: has(self.spec.databaseName) || !(self.metadata.name in ['postgres',
            'template0', 'template1'])
    served: true
    storage: true
    subresources:
      status: {}
