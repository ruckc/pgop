version = 1

[workflows.review-pr]
description = "Review newly opened pull requests"
on = ["pull_request.opened"]
if = "event.pull_request.draft == false"
start = "review"

[workflows.review-pr.nodes.review]
type = "agent"
mode = "reviewer"
instruction = "Review pull request #{{ event.pull_request.number }}: {{ event.pull_request.title }}. Write a short code review."
next = [{ if = "exit == 'success' and result", to = "comment" }, { to = "review_failed" }]


[workflows.review-pr.nodes.review_failed]
type = "end"
status = "failed"
reason = "the reviewer failed: {{ nodes.review.error if nodes.review.error else 'no result was submitted' }}"

[workflows.review-pr.nodes.review.result.summary]
type = "string"

[workflows.review-pr.nodes.comment]
type = "action"
action = "comment"
body = "{{ nodes.review.result.summary }}"
next = "done"

[workflows.review-pr.nodes.done]
type = "end"
status = "done"
