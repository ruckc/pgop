version: 2
updates:
  # Base images of the operator image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  # Base images of the pgBackRest images. The postgres base is selected with
  # the PG_MAJOR build argument and tracks the latest minor release; the
  # weekly scheduled rebuild (.github/workflows/images.yml) picks up its
  # security fixes. pgBackRest itself is pinned by PGBACKREST_VERSION and
  # PGBACKREST_SHA256 (and pgbackrestVersion in internal/controller), which
  # are bumped by hand.
  - package-ecosystem: docker
    directory: /images/pgbackrest
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
