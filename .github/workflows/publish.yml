name: Test and then Publish Container

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  call-test:
    uses: ./.github/workflows/test.yml

  call-e2e:
    uses: ./.github/workflows/test-e2e.yml

  call-lint:
    uses: ./.github/workflows/lint.yml

  call-release:
    needs: [call-test, call-e2e, call-lint]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
