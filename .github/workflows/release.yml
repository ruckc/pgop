name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. v1.2.3). Leave empty to auto-calculate from commits.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          OVERRIDE="${{ github.event.inputs.version }}"

          if [ -n "$OVERRIDE" ]; then
            if [[ ! "$OVERRIDE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version override must match v<major>.<minor>.<patch> format"
              exit 1
            fi
            echo "NEW_VERSION=$OVERRIDE" >> "$GITHUB_ENV"
            echo "Using manual override: $OVERRIDE"
            exit 0
          fi

          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found; starting at v0.1.0"
            echo "NEW_VERSION=v0.1.0" >> "$GITHUB_ENV"
            exit 0
          fi

          MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LAST_TAG" | cut -d. -f3)

          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b%-C()%n")

          BUMP="patch"
          if echo "$COMMITS" | grep -qE 'BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) NEW_VERSION="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Last tag: $LAST_TAG  →  $NEW_VERSION (bump: $BUMP)"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Create and push tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "${{ env.NEW_VERSION }}" -m "Release ${{ env.NEW_VERSION }}"
          git push origin "${{ env.NEW_VERSION }}"

      - name: Checkout tagged version
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ env.NEW_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to the Container registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.NEW_VERSION }}" \
            --title "${{ env.NEW_VERSION }}" \
            --generate-notes \
            --latest
