name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. v1.2.3). Leave empty to auto-calculate from commits.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        uses: golangci/golangci-lint-action@v9.2.1

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-build-

      - name: Run tests
        run: |
          go mod tidy
          make test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-e2e-
            ${{ runner.os }}-go-build-

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run E2E tests
        run: |
          go mod tidy
          make test-e2e

  lint-helm:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0

      - name: Lint chart
        run: helm lint charts/pgop --strict

  prepare-release:
    name: Prepare Release
    needs: [lint, test, test-e2e, lint-helm]
    # Only run on main or manual dispatch, and skip if this push is itself a release merge
    if: |
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.calc.outputs.version }}
      branch: ${{ steps.commit.outputs.branch }}
      staging_tag: ${{ steps.commit.outputs.staging_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Calculate version
        id: calc
        run: |
          OVERRIDE="${{ inputs.version }}"
          if [ -n "$OVERRIDE" ]; then
            if [[ ! "$OVERRIDE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version override must match v<major>.<minor>.<patch> format"
              exit 1
            fi
            echo "version=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found; starting at v0.1.0"
            echo "version=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b%-C()%n")

          BUMP="patch"
          if echo "$COMMITS" | grep -qE 'BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) VERSION="v$((MAJOR + 1)).0.0" ;;
            minor) VERSION="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Last tag: $LAST_TAG → $VERSION (bump: $BUMP)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch, update chart, commit, and tag
        id: commit
        run: |
          VERSION="${{ steps.calc.outputs.version }}"
          CHART_VERSION="${VERSION#v}"
          BRANCH="release/${VERSION}"

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git checkout -b "$BRANCH"

          # Stamp version into tracked files
          echo "$VERSION" > VERSION
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/pgop/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/pgop/Chart.yaml

          # Refresh CRDs in the chart from the generated sources
          cp config/crd/bases/*.yaml charts/pgop/crds/

          git add VERSION charts/pgop/Chart.yaml charts/pgop/crds/
          git commit -m "chore: release ${VERSION}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${BRANCH}" --tags

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "staging_tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [prepare-release]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.prepare-release.outputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.staging_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0

      - name: Package Helm chart
        run: helm package charts/pgop

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: helm-chart
          path: "*.tgz"
          retention-days: 1

  release:
    name: Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.prepare-release.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Log in to registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote staging image to release tags
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.staging_tag }}"

      - name: Download Helm chart artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: helm-chart

      - name: Push Helm chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin
          helm push pgop-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Merge release branch into main
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "origin/${{ needs.prepare-release.outputs.branch }}" \
            -m "chore: release ${{ needs.prepare-release.outputs.version }}"
          git push origin main

      - name: Delete release branch
        run: git push origin --delete "${{ needs.prepare-release.outputs.branch }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare-release.outputs.version }}" \
            --title "${{ needs.prepare-release.outputs.version }}" \
            --generate-notes \
            --latest

      - name: Attach Helm chart to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare-release.outputs.version }}" pgop-*.tgz

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install mkdocs
        run: pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v5.0.0
