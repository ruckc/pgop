name: pgBackRest Images

# Builds the pgBackRest images from images/pgbackrest/Dockerfile (one pinned
# pgBackRest build):
#
#   ghcr.io/<owner>/pgop-pgbackrest:<pgbackrest>          backup/restore Jobs
#   ghcr.io/<owner>/pgop-postgres:<major>-<pgbackrest>    Clusters with physical backups
#   ghcr.io/<owner>/pgop-postgres:<major>                 (floating)
#
# Pull requests that touch the images build them for every platform without
# pushing. Pushes to main publish them (with provenance and an SBOM), and a
# weekly scheduled run rebuilds and republishes the same tags so base-image
# (Debian, postgres minor release) security fixes reach them without a
# pgBackRest bump.

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/images.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}${{ matrix.pg_major && format(' (PostgreSQL {0})', matrix.pg_major) || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pgbackrest
            image: pgop-pgbackrest
            pg_major: ''
          - target: postgres
            image: pgop-postgres
            pg_major: '16'
          - target: postgres
            image: pgop-postgres
            pg_major: '17'
          - target: postgres
            image: pgop-postgres
            pg_major: '18'
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Compute tags
        id: meta
        run: |
          VERSION=$(sed -n 's/^ARG PGBACKREST_VERSION=//p' images/pgbackrest/Dockerfile | head -1)
          if [ -z "$VERSION" ]; then
            echo "PGBACKREST_VERSION not found in images/pgbackrest/Dockerfile" >&2
            exit 1
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ matrix.image }}"
          if [ -n "${{ matrix.pg_major }}" ]; then
            TAGS="${IMAGE}:${{ matrix.pg_major }}-${VERSION},${IMAGE}:${{ matrix.pg_major }}"
          else
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: images/pgbackrest
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.pg_major && format('PG_MAJOR={0}', matrix.pg_major) || '' }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          pull: true
          # The builder stage (the pgBackRest compile) is shared by all
          # targets; one cache scope lets the matrix reuse it.
          cache-from: type=gha,scope=pgbackrest-images
          cache-to: type=gha,scope=pgbackrest-images,mode=max

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
