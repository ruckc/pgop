apiVersion: pgop.ruck.io/v1alpha1
kind: Database
metadata:
  name: myapp
spec:
  clusterRef:
    name: example-cluster
  # Optional PostgreSQL database name; defaults to metadata.name. Immutable.
  # databaseName: my_app
  # owner is the name of a Role resource (not a raw PostgreSQL role name).
  owner: app-user
  # Optional database-level privileges for PostgreSQL roles (CONNECT, CREATE,
  # TEMPORARY/TEMP, ALL). Removed entries are revoked. Grantees are PUBLIC,
  # roles managed by Roles of this Cluster, or roles the Cluster lists in
  # spec.rolePolicy.allowedExistingRoles (others: GranteeNotAllowed).
  # grants:
  #   - role: app_reader
  #     privileges: [CONNECT]
  # Optional: revoke PostgreSQL's default PUBLIC privileges (false revokes;
  # pgop grants back exactly what it revoked once a field is unset). Roles
  # that should still connect then need their own CONNECT grant.
  # publicPrivileges:
  #   connect: false
  #   temporary: false
  #   publicSchemaUsage: false
  # Optional per-database parameter defaults (ALTER DATABASE ... SET).
  # Removed keys are reset. Only user-settable parameters, and custom ones in
  # namespaces the Cluster lists in rolePolicy.allowedSettingPrefixes, are
  # allowed. The YAML single quotes below are only quoting; the value is the
  # postgresql.conf list "$user", app, public.
  # settings:
  #   search_path: '"$user", app, public'
  #   statement_timeout: 30s
  # Extensions are installed by the operator as a superuser, so only those
  # the server marks as trusted (uuid-ossp, pg_trgm and citext are) or that
  # the Cluster lists in spec.rolePolicy.allowedExtensions are installed, and
  # only into schemas no untrusted role can write to. Removing an entry
  # leaves the extension installed unless dropOnRemoval was set.
  extensions:
    - name: uuid-ossp
    - name: pg_trgm
    # - name: citext
    #   version: "1.8"          # changing it runs ALTER EXTENSION ... UPDATE TO
    #   # EXECUTE on the extension's SQL/PL/pgSQL (non-SECURITY DEFINER)
    #   # functions; C and SECURITY DEFINER functions are skipped.
    #   grants:
    #     - role: app-user
    #       functions: [EXECUTE]
    # - name: earthdistance     # untrusted: needs rolePolicy.allowedExtensions
    #   schema: geo             # created by pgop, owned by the operator
    #   cascade: true           # also installs cube (must pass the policy too)
  schemas:
    - name: app
      owner: app-user
      # Schema privileges (USAGE, CREATE, ALL). pgop tracks what it granted
      # in status.managedSchemaGrants and revokes removed entries.
      grants:
        - role: app-user
          privileges:
            - USAGE
            - CREATE
      # Optional privileges on objects of the schema. Only objects owned by
      # roles of this Cluster's Roles
      # are granted on (see the Databases guide); "*" selects every object of
      # the kind on each reconcile. pgop tracks what it granted per object
      # and revokes it once no entry selects the object.
      # objectGrants:
      #   - role: app_reader
      #     kind: table             # table, sequence, function, procedure, type
      #     objects: ["*"]          # or names: [orders, "refresh(integer)"]
      #     privileges: [SELECT]
      # Optional default privileges for objects a role of this Cluster's
      # Roles creates in the schema later (for example the migrator).
      # defaultPrivileges:
      #   - forRole: app-user       # PostgreSQL role name
      #     role: app_reader
      #     kind: table             # table, sequence, function, type
      #     privileges: [SELECT]
