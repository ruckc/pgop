apiVersion: pgop.ruck.io/v1alpha1
kind: Role
metadata:
  name: app-user
spec:
  clusterRef:
    name: example-cluster
  # Optional PostgreSQL role name; defaults to metadata.name. Immutable.
  # roleName: app_user
  login: true
  createDB: false
  inherit: true
  # Privileged attributes (createRole, replication, bypassRLS) are refused
  # unless the Cluster lists them in spec.rolePolicy.allowedAttributes.
  # Superuser is never available.
  # createRole: false
  connectionLimit: 10
  # Optional memberships in other PostgreSQL roles (raw PostgreSQL role names).
  # inherit/set require PostgreSQL 16+. Removed entries are revoked.
  # Superuser roles, postgres, pgop_* roles and predefined pg_* roles not
  # allowed by the Cluster's spec.rolePolicy.allowedPredefinedRoles are refused.
  # memberships:
  #   - role: app_read_role
  #     inherit: true
  #     set: false
  #     admin: false
  # Optional privileges to SET superuser-only parameters (PostgreSQL 15+).
  # Only SET is supported. Removed entries are revoked.
  # parameterGrants:
  #   - parameter: log_statement
  # Optional defaults for this role's sessions (ALTER ROLE ... SET), and per
  # database (ALTER ROLE ... IN DATABASE ... SET). Only user-context and
  # custom parameters; removed entries pgop set are reset. Values are
  # readable by every role on the server: no secrets.
  # settings:
  #   statement_timeout: 30s
  #   search_path: '"$user", app'
  # databaseSettings:
  #   - database: app_db
  #     settings:
  #       work_mem: 64MB
  # Password is auto-generated and stored in a Secret named: <cluster-name>-<role-name>-credentials
  # The secret contains keys: username, password, host, port
