apiVersion: pgop.ruck.io/v1alpha1
kind: Role
metadata:
  name: app-user
spec:
  clusterRef:
    name: example-cluster
  # Optional PostgreSQL role name; defaults to metadata.name. Immutable.
  # roleName: app_user
  login: true
  superuser: false
  createDB: false
  createRole: false
  inherit: true
  connectionLimit: 10
  # Optional memberships in other PostgreSQL roles (raw PostgreSQL role names).
  # inherit/set require PostgreSQL 16+. Removed entries are revoked.
  # memberships:
  #   - role: app_read_role
  #     inherit: true
  #     set: false
  #     admin: false
  # Password is auto-generated and stored in a Secret named: <cluster-name>-<role-name>-credentials
  # The secret contains keys: username, password, host, port
