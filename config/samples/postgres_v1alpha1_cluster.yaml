apiVersion: pgop.ruck.io/v1alpha1
kind: Cluster
metadata:
  name: example-cluster
spec:
  image: postgres:18
  # Total PostgreSQL instances: 1 primary plus (replicas - 1) streaming
  # read-only standbys, reachable through the Service <name>-ro.
  replicas: 1
  port: 5432
  storage:
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # PostgreSQL configuration parameters. Changes are reloaded; parameters that
  # need a restart (such as shared_preload_libraries) restart the pod once.
  parameters:
    shared_preload_libraries: pg_stat_statements
    work_mem: 8MB
