apiVersion: pgop.ruck.io/v1alpha1
kind: Restore
metadata:
  name: myapp-restore
spec:
  # logical restore: pg_restore from a pg_dump artifact in object storage
  type: logical
  backupRunRef:
    name: myapp-backup-data-20260101T020000
  clusterRef:
    name: example-cluster
  databaseRef:
    name: myapp
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Restore
metadata:
  name: example-cluster-pitr
spec:
  # physical restore: pgBackRest, optionally to a point in time. The operator
  # stops the Cluster, restores its data volume and starts it again, once the
  # Cluster confirms it:
  #   kubectl annotate cluster example-cluster pgop.ruck.io/allow-restore=example-cluster-pitr
  # See docs/user-guide/restores.md.
  type: physical
  backupRunRef:
    name: example-cluster-backup-full-29342160
  clusterRef:
    name: example-cluster
  targetTime: "2026-01-01T06:00:00Z"
