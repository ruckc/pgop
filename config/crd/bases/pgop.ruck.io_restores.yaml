  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.startTime
      name: Started
      type: date
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Restore is the Schema for the restores API.
          Each instance triggers a one-shot restore of a BackupRun into a target Cluster/Database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RestoreSpec defines the desired state of Restore.
            properties:
              backupRunRef:
                description: |-
                  backupRunRef references the BackupRun to restore from. The referenced
                  BackupRun's parent Backup provides the destination/credentials.
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              clusterRef:
                description: |-
                  clusterRef references the target Cluster to restore into. It may differ
                  from the cluster the backup was taken from.
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              databaseRef:
                description: |-
                  databaseRef references the target Database for logical restores.
                  Required when type is logical.
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              targetTime:
                description: |-
                  targetTime performs a point-in-time recovery to the given timestamp
                  (physical restores only). When omitted, the latest available state is
                  restored.
                format: date-time
                type: string
              type:
                description: |-
                  type selects the restore strategy: logical (pg_restore from a pg_dump
                  artifact in object storage) or physical (pgBackRest restore).
                enum:
                - physical
                - logical
                type: string
            required:
            - backupRunRef
            - clusterRef
            - type
            type: object
          status:
