---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: backups.pgop.ruck.io
spec:
  group: pgop.ruck.io
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Backup is the Schema for the backups API.
          It defines a backup policy for a PostgreSQL cluster or database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupSpec defines the desired state of Backup
            properties:
              backupRunTTL:
                default: 168h
                description: backupRunTTL is how long to keep completed BackupRun
                  records
                type: string
              clusterRef:
                description: clusterRef references the Cluster to back up (required
                  for physical backups)
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              databaseRef:
                description: databaseRef references the Database to back up (required
                  for logical backups)
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              destination:
                description: destination configures where backups are stored
                properties:
                  azure:
                    description: azure configures Azure Blob Storage
                    properties:
                      container:
                        description: container is the Azure Blob container name
                        type: string
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef references a Secret with Azure credentials.
                          Key: AZURE_STORAGE_KEY or AZURE_CLIENT_SECRET etc.
                          If omitted, workload identity is used.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
