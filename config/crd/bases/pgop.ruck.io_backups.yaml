                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      storageAccount:
                        description: storageAccount is the Azure storage account name
                        type: string
                    required:
                    - container
                    - storageAccount
                    type: object
                  gcs:
                    description: gcs configures Google Cloud Storage
                    properties:
                      bucket:
                        description: bucket is the GCS bucket name
                        type: string
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef references a Secret with a GCS service account key JSON.
                          Key: credentials.json.
                          If omitted, workload identity is used.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      prefix:
                        description: prefix is the path prefix within the bucket
                        type: string
                    required:
                    - bucket
                    type: object
                  s3:
                    description: s3 configures S3 or S3-compatible storage
                    properties:
                      bucket:
                        description: bucket is the S3 bucket name
                        type: string
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef references a Secret with AWS credentials.
                          Keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
                          If omitted, ambient credentials (IRSA/instance profile) are used.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: endpoint overrides the default S3 endpoint (for
                          S3-compatible storage)
                        type: string
                      prefix:
                        description: prefix is the path prefix within the bucket
                        type: string
                      region:
                        description: region is the AWS region (or equivalent)
                        type: string
                    required:
                    - bucket
                    - region
                    type: object
                  type:
                    description: type is the storage provider type
                    enum:
                    - s3
                    - azure
                    - gcs
                    type: string
                required:
                - type
                type: object
              encryption:
                description: encryption configures optional client-side encryption
                properties:
                  enabled:
                    description: enabled enables client-side AES-256 encryption
                    type: boolean
                  keySecretRef:
                    description: keySecretRef references the secret containing the
                      encryption key
                    properties:
                      key:
                        description: key is the key in the secret to select
                        type: string
                      name:
                        description: name is the name of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - enabled
                type: object
              physical:
                description: physical configures schedules for physical backups
                properties:
                  fullSchedule:
                    default: 0 2 * * 0
                    description: fullSchedule is the cron schedule for full backups
                    type: string
                  incrementalSchedule:
                    default: 0 2 * * 1-6
                    description: incrementalSchedule is the cron schedule for incremental
                      backups
                    type: string
                type: object
              retention:
                description: retention configures backup retention policy
                properties:
                  disabled:
                    default: true
                    description: |-
                      disabled prevents the operator from deleting old backups.
                      Set to true when using write-only credentials to avoid ransomware exposure.
                    type: boolean
                  keepDays:
                    description: keepDays retains backups newer than N days (requires
                      disabled=false)
                    format: int32
                    type: integer
                  keepLast:
                    description: keepLast retains the most recent N backups (requires
                      disabled=false)
                    format: int32
                    type: integer
                type: object
              schedule:
                description: schedule is the cron schedule for logical backups (schema
                  + data share one schedule)
                type: string
              type:
                description: 'type is the backup strategy: physical (pgBackRest) or
                  logical (pg_dump)'
                enum:
                - physical
                - logical
                type: string
            required:
            - destination
            - type
            type: object
          status:
