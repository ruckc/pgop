---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: roles.pgop.ruck.io
spec:
  group: pgop.ruck.io
  names:
    kind: Role
    listKind: RoleList
    plural: roles
    singular: role
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Role is the Schema for the roles API.
          It represents a PostgreSQL role (user) managed by the operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Role
            properties:
              bypassRLS:
                description: bypassRLS allows the role to bypass row-level security
                  policies
                type: boolean
              clusterRef:
                description: clusterRef references the PostgreSQL Cluster this role
                  belongs to
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              connectionLimit:
                default: -1
                description: |-
                  connectionLimit sets the maximum number of concurrent connections for this role.
                  -1 means unlimited.
                format: int32
                minimum: -1
                type: integer
              createDB:
                description: createDB allows the role to create new databases
                type: boolean
              createRole:
                description: createRole allows the role to create other roles
                type: boolean
              inherit:
                default: true
                description: inherit allows the role to inherit privileges from roles
                  it is a member of
                type: boolean
              login:
                default: true
                description: login allows the role to log in (connect to the database)
                type: boolean
              memberOf:
                description: memberOf lists roles this role should be a member of
                items:
                  type: string
                type: array
              passwordSecretRef:
                description: |-
                  passwordSecretRef references a Secret containing the password for this role.
                  The secret must contain a key with the password value.
                properties:
                  key:
                    description: key is the key in the secret to select
                    type: string
                  name:
                    description: name is the name of the secret
                    type: string
                required:
                - key
                - name
                type: object
              replication:
                description: replication allows the role to initiate replication connections
                type: boolean
              superuser:
                description: superuser grants superuser privileges to the role
                type: boolean
            required:
            - clusterRef
            type: object
          status:
            description: status defines the observed state of Role
            properties:
              conditions:
                description: conditions represent the current state of the Role resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ready:
                description: ready indicates if the role has been created in the database
                type: boolean
              secretName:
                description: |-
                  secretName is the name of the Secret containing the role's credentials.
                  The secret contains 'username' and 'password' keys.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
