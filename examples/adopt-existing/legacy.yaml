# Bringing a role and a database that already exist (created by a DBA, a
# migration from another platform, or a restore) under pgop's management.
# Only a Cluster editor can allow this: Role and Database writers can never
# take over objects pgop did not create for them.
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Cluster
metadata:
  name: legacy-db
spec:
  image: postgres:17
  storage:
    size: 50Gi
  rolePolicy:
    # pgop may take these over: it then sets their attributes and password,
    # hands the password out and drops them when the resource is deleted.
    adoptableRoles: [legacy_app]
    adoptableDatabases: [legacy]
    # Roles pgop does not manage that Roles may join and Databases may grant to.
    allowedExistingRoles: [dba_readonly]
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Role
metadata:
  name: legacy-app
spec:
  clusterRef:
    name: legacy-db
  roleName: legacy_app       # the existing role
  login: true
  # pgop generates a new password for the adopted role (or use
  # passwordSecretRef to keep the one the application already has).
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Database
metadata:
  name: legacy
spec:
  clusterRef:
    name: legacy-db
  databaseName: legacy       # the existing database
  # Declare the owner: pgop then makes legacy_app the owner, and the schemas
  # legacy_app owns count as managed. Without owner, existing schemas owned
  # by a role no Role manages report SchemaNotManaged.
  owner: legacy-app
  grants:
    - role: dba_readonly     # listed in allowedExistingRoles
      privileges: [CONNECT]
  # An existing schema only counts as managed when it is owned by
  # pg_database_owner (public on PostgreSQL 15+), by the declared owner
  # (legacy_app) or by its declared schema owner (a non-superuser), or is the
  # public schema of a PostgreSQL 14 database owned by the bootstrap
  # superuser. A legacy public schema owned by any other role (for example a
  # "postgres" role that is not the bootstrap superuser) reports
  # SchemaNotManaged and gets no grants.
  schemas:
    - name: public           # owned by pg_database_owner here: managed
      grants:
        - role: dba_readonly
          privileges: [USAGE]
