# Logical restore of a pg_dump artifact into the Database "shop".
# Logical backup Jobs do not record BackupRuns, so record the dump to restore
# first: create this BackupRun, then set its location (the "Uploaded to ..."
# line of the backup Job's s3-upload container log) on the status subresource:
#
#   kubectl patch backuprun shop-data-20261001 --subresource=status --type=merge \
#     -p '{"status":{"location":"s3://pgop-backups/logical/shop/data/20261001T013000.dump"}}'
#
# Then apply the Restore. It runs pg_restore --no-owner --clean --if-exists as
# the operator's superuser (see docs/user-guide/restores.md).
---
apiVersion: pgop.ruck.io/v1alpha1
kind: BackupRun
metadata:
  name: shop-data-20261001
spec:
  backupRef:
    name: shop-logical         # provides the bucket, endpoint and credentials
  type: data
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Restore
metadata:
  name: shop-restore-20261001
spec:
  type: logical
  backupRunRef:
    name: shop-data-20261001
  clusterRef:
    name: shop-db              # may differ from the Cluster the dump came from
  databaseRef:
    name: shop
